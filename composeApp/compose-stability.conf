// Compose compiler stability configuration.
//
// The UI receives its data as immutable snapshots from repositories (StateFlow emissions of data
// classes built from `val`s). Their List/Set/Map fields made the compiler treat every one of those
// models as unstable, so composables taking them could only skip when handed the very same
// instance. Declaring the read-only collection interfaces stable lets those models be inferred
// stable, so a re-emitted but unchanged model (equal by `equals`) no longer recomposes the rows,
// cards and sections that display it.
//
// Only list types here that are never mutated after being handed to the UI.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection
kotlin.time.Duration
kotlin.time.Instant
kotlinx.datetime.*
