name: PR Full Release Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [enhanced]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-release-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-release-build:
    name: Build fullRelease APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing properties
        env:
          RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_PROPERTIES_BASE64}" ]]; then
            echo "::error::Missing NUVIO_LOCAL_PROPERTIES_BASE64 secret"
            exit 1
          fi

          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing NUVIO_RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"

          printf '%s' "${RELEASE_KEYSTORE_BASE64}" \
            | base64 --decode > "${keystore_path}"

          printf '%s' "${RELEASE_PROPERTIES_BASE64}" \
            | base64 --decode > local.properties

          sed -i -E \
            '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' \
            local.properties

          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' \
            "${keystore_path}" >> local.properties

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            SIMKL_CLIENT_ID
          )

          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "::error::Missing required property: ${property_name}"
              exit 1
            fi
          done

      - name: Build fullRelease APK
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullRelease APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/release/androidApp-full-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
